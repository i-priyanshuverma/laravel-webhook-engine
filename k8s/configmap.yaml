apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-engine-config
  namespace: default
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://webhooks.company.com"
  LOG_CHANNEL: "stack"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_DATABASE: "webhook_engine"
  QUEUE_CONNECTION: "redis"
  REDIS_CLIENT: "predis"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
