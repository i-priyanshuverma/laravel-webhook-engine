apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-horizon
  namespace: default
  labels:
    app: webhook-horizon
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webhook-horizon
  template:
    metadata:
      labels:
        app: webhook-horizon
        component: worker
    spec:
      containers:
        - name: horizon
          image: laravel-webhook-engine:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "horizon"]
          envFrom:
            - configMapRef:
                name: webhook-engine-config
            - secretRef:
                name: webhook-engine-secrets
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1024Mi
          livenessProbe:
            exec:
              command:
                - php
                - artisan
                - horizon:status
            initialDelaySeconds: 20
            periodSeconds: 15
